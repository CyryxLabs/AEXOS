# components/ is derived from disk by scripts/normalize-squad-manifests.js.
# ═══════════════════════════════════════════════════════════════════════════════

name: claude-code-mastery
version: 1.0.0
short-title: Claude Code Mastery Squad
description: >-
  Squad especialista em todas as dimensões do Claude Code: hooks, skills, subagents, MCP, plugins,
  agent teams, customização, integração com projetos, roadmap tracking, e AEXOS-core architecture
  awareness.
author: Cyryx Labs LLC
license: UNLICENSED
slashPrefix: claude-code-mastery
tags:
  - claude-code
  - hooks
  - skills
  - subagents
  - mcp
  - plugins
  - agent-teams
  - customization
  - integration
  - context-engineering
  - roadmap
  - aexos
cyryx:
  minVersion: 2.1.0
  type: squad
components:
  tasks:
    - audit-integration.md
    - audit-settings.md
    - audit-setup.md
    - brownfield-setup.md
    - ci-cd-setup.md
    - claude-md-engineer.md
    - configure-claude-code.md
    - context-rot-audit.md
    - create-agent-definition.md
    - create-rules.md
    - create-team-topology.md
    - diagnose.md
    - enterprise-config.md
    - hook-designer.md
    - integrate-project.md
    - mcp-integration-plan.md
    - mcp-workflow.md
    - multi-project-setup.md
    - optimize-context.md
    - optimize-workflow.md
    - parallel-decomposition.md
    - permission-strategy.md
    - sandbox-setup.md
    - setup-repository.md
    - setup-wizard.md
    - worktree-strategy.md
  agents:
    - claude-mastery-chief.md
    - config-engineer.md
    - hooks-architect.md
    - mcp-integrator.md
    - project-integrator.md
    - roadmap-sentinel.md
    - skill-craftsman.md
    - swarm-orchestrator.md
  workflows:
    - wf-audit-complete.yaml
    - wf-knowledge-update.yaml
    - wf-project-setup.yaml
  checklists:
    - agent-team-readiness-checklist.md
    - brownfield-readiness-checklist.md
    - change-checklist.md
    - context-rot-checklist.md
    - integration-audit-checklist.md
    - multi-agent-review-checklist.md
    - pre-push-checklist.md
  templates:
    - claude-md-fullstack.md
    - claude-md-library.md
    - claude-md-microservices.md
    - claude-md-mobile.md
    - claude-md-monorepo.md
    - github-actions-claude-ci.yml
    - github-actions-claude-review.yml
  tools: []
  scripts:
    - validate-setup.js
config:
  extends: extend
dependencies:
  node: []
  squads: []
squad:
  name: claude-code-mastery
  display_name: Claude Code Mastery Squad
  version: 1.0.0
  domain: Claude Code — Full Spectrum Expertise
  description: |
    Squad especialista em todas as dimensões do Claude Code: hooks, skills,
    subagents, MCP, plugins, agent teams, customização, integração com projetos,
    roadmap tracking, e AEXOS-core architecture awareness.
  philosophy: |
    "Master the tool to master the craft."
    Cada agent é baseado em elite minds reais com frameworks documentados
    no ecossistema Claude Code. O squad cobre desde automação com hooks
    até orquestração multi-agente e engenharia de contexto.
  keywords:
    - claude-code
    - hooks
    - skills
    - subagents
    - mcp
    - plugins
    - agent-teams
    - customization
    - integration
    - context-engineering
    - roadmap
    - aexos
  entry_agent: claude-mastery-chief
  created_by: squad-creator-pro
  created_at: '2026-03-01'
tiers:
  tier_0:
    name: Diagnosis & Routing
    agents:
      - claude-mastery-chief
    purpose: Triage requests, route to specialist, maintain squad coherence
  tier_1:
    name: Core Mastery
    agents:
      - hooks-architect
      - mcp-integrator
      - swarm-orchestrator
      - config-engineer
    purpose: Deep expertise in Claude Code feature domains
  tier_2:
    name: Strategic & Context
    agents:
      - skill-craftsman
      - project-integrator
      - roadmap-sentinel
    purpose: 'Cross-cutting expertise: skills, project integration, roadmap awareness'
agents:
  claude-mastery-chief:
    persona: Warden
    file: agents/claude-mastery-chief.md
    tier: 0
    based_on: Original (Orchestrator)
    icon: 🧠
    focus: Triage, routing, AEXOS-core awareness
  hooks-architect:
    persona: Latch
    file: agents/hooks-architect.md
    tier: 1
    based_on: disler (Hooks Mastery)
    icon: 🎣
    focus: 17 hook events, automation pipelines, meta-agent patterns
  mcp-integrator:
    persona: Piper
    file: agents/mcp-integrator.md
    tier: 1
    based_on: Peter Steinberger (@steipete)
    icon: 🔌
    focus: MCP servers, tool discovery, agent-as-MCP, integration patterns
  swarm-orchestrator:
    persona: Nexus
    file: agents/swarm-orchestrator.md
    tier: 1
    based_on: Kieran Klaassen + Reuven Cohen
    icon: 🕸️
    focus: Agent Teams, subagents, multi-session coordination, worktrees
  config-engineer:
    persona: Sigil
    file: agents/config-engineer.md
    tier: 1
    based_on: SuperClaude-Org
    icon: ⚙️
    focus: Settings, permissions, CLAUDE.md, rules, managed policies, personas
  skill-craftsman:
    persona: Anvil
    file: agents/skill-craftsman.md
    tier: 2
    based_on: BMAD-CODE-ORG + community
    icon: ✨
    focus: Skills, commands, plugins, context engineering, spec-driven dev
  project-integrator:
    persona: Conduit
    file: agents/project-integrator.md
    tier: 2
    based_on: Daniel Miessler (PAI)
    icon: 🛠️
    focus: Project integration, repository setup, AEXOS-core awareness, Unix philosophy
  roadmap-sentinel:
    persona: Vigil
    file: agents/roadmap-sentinel.md
    tier: 2
    based_on: Boris Cherny (philosophy) + Official sources
    icon: 🧭
    focus: Roadmap tracking, changelog monitoring, feature adoption, plan-first
handoffs:
  claude-mastery-chief:
    routes_to:
      - hooks-architect
      - mcp-integrator
      - swarm-orchestrator
      - config-engineer
      - skill-craftsman
      - project-integrator
      - roadmap-sentinel
  hooks-architect:
    collaborates_with:
      - config-engineer
      - skill-craftsman
    escalates_to:
      - claude-mastery-chief
  mcp-integrator:
    collaborates_with:
      - hooks-architect
      - project-integrator
    escalates_to:
      - claude-mastery-chief
  swarm-orchestrator:
    collaborates_with:
      - hooks-architect
      - config-engineer
    escalates_to:
      - claude-mastery-chief
  config-engineer:
    collaborates_with:
      - hooks-architect
      - skill-craftsman
      - project-integrator
    escalates_to:
      - claude-mastery-chief
  skill-craftsman:
    collaborates_with:
      - hooks-architect
      - config-engineer
    escalates_to:
      - claude-mastery-chief
  project-integrator:
    collaborates_with:
      - config-engineer
      - mcp-integrator
      - roadmap-sentinel
    escalates_to:
      - claude-mastery-chief
  roadmap-sentinel:
    collaborates_with:
      - project-integrator
      - claude-mastery-chief
    escalates_to:
      - claude-mastery-chief
cross_cutting:
  aexos_awareness:
    description: ALL agents understand AEXOS-core architecture
    context_files:
      - .claude/CLAUDE.md
      - .aexos-core/core-config.yaml
      - .aexos-core/data/entity-registry.yaml
  update_knowledge:
    description: Command to refresh from Claude Code changelog and roadmap
    command: '*update-knowledge'
    sources:
      - https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
      - https://code.claude.com/docs/en/overview
      - https://github.com/anthropics/claude-code/releases
  quality_standards:
    min_score: 7
    smoke_tests: 3
    voice_dna_required: true
    thinking_dna_required: true
settings:
  greeting:
    level: archetypal
    show_project_status: true
    show_aexos_context: true
  activation:
    prefix: claude-code-mastery
    example: '@claude-code-mastery:hooks-architect'
