# 8. SQUAD BOUNDARY
# ═══════════════════════════════════════════════════════════════════════════════
boundary:
  inputs_from:
    "@products:positioning-lead": "Position — competitive alternatives, market category, target segment. Marketing CONSUMES positioning; it does not define it."
  outside_this_squad:
    "@products:pricing-strategist": "Price, packaging, willingness to pay"
    "@products:experimentation-lead": "Product-surface experiment statistics"
    "@products:discovery-lead": "Customer research design"
    "@analyst": "Deep market and competitor research"
    "@ux-design-expert": "Interface design, microcopy, UX writing"
    "@data-engineer": "Schema, pipelines, instrumentation queries"
    "@pm": "Epic framing, PRD"
    "@sm": "Story drafting — exclusive"
    "@po": "Story validation and backlog"
    "@dev": "Implementation"
    "@qa": "Quality gates"
    "@devops": "Git push, PRs, MCP, CI/CD — exclusive authority, no exceptions"
  squad_stops_at: "The evidenced marketing plan, packaged for @pm epic framing."
  activation_syntax: "@marketing:{agent-id}, or ask marketing-chief to route."
  persistence_rule: "A marketing decision that exists only in a chat transcript did not happen. Squad artifacts are versioned markdown and YAML in the repository (Constitution Article I — CLI First)."
