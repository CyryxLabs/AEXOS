name: sales
version: 1.0.0
short-title: Sales Squad
description: >-
  Squad comercial: qualificação, método de venda consultiva, negociação e operação de pipeline. Do
  primeiro contato ao fechamento.
author: Cyryx Labs LLC
license: UNLICENSED
slashPrefix: sales
tags:
  - sales
  - qualification
  - meddic
  - negotiation
  - pipeline
  - enterprise-sales
  - aexos
cyryx:
  minVersion: 2.1.0
  type: squad
components:
  tasks:
    - method-lead-build-insight.md
    - negotiation-lead-prep.md
    - pipeline-ops-stage-design.md
    - qualification-lead-qualify.md
